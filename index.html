<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアル声 発声アプリ（iOS対策版）</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f4f8; margin: 0; }
    .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
    textarea { width: 100%; height: 120px; margin-bottom: 15px; padding: 10px; box-sizing: border-box; font-size: 18px; border-radius: 8px; border: 1px solid #ccc; resize: none; }
    button { width: 100%; padding: 15px; font-size: 20px; font-weight: bold; background-color: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    button:active { background-color: #3e8e41; transform: scale(0.98); }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 14px; color: #555; height: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <textarea id="textInput" placeholder="伝えたいことを入力..."></textarea>
    <button id="speakButton" onclick="speakText()">🗣️ リアルな声で喋る</button>
    <div id="statusText" class="status"></div>
  </div>
  <script>
    // iOS対策: 音声プレイヤーをあらかじめグローバルに作っておく
    const audioPlayer = new Audio();

    async function speakText() {
      const text = document.getElementById('textInput').value;
      if (!text) return;

      const button = document.getElementById('speakButton');
      const statusText = document.getElementById('statusText');

      // iOS対策: ボタンを押した直後に再生処理を走らせて音声エンジンのロックを解除
      audioPlayer.play().catch(() => {});

      button.disabled = true;
      statusText.innerText = "通信中...";

      const speakerId = 3; // 20: もち子(さん)
      const apiUrl = `https://api.tts.quest/v3/voicevox/synthesis?text=${encodeURIComponent(text)}&speaker=${speakerId}`;

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.success) {
          statusText.innerText = "再生中...";
          
          audioPlayer.src = data.mp3DownloadUrl;
          audioPlayer.onended = () => {
            statusText.innerText = "";
            button.disabled = false;
          };

          audioPlayer.play().catch(e => {
            statusText.innerText = "再生エラー（マナーモード等を確認してください）";
            button.disabled = false;
          });
        } else {
          statusText.innerText = "サーバー混雑中。時間をおいて再試行してください。";
          button.disabled = false;
        }
      } catch(e) {
        console.error(e);
        statusText.innerText = "通信エラーが発生しました";
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
