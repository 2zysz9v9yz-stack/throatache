<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドラム風 発声アプリ</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f5f5f5; margin: 0; }
    .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
    textarea { width: 100%; height: 120px; margin-bottom: 15px; padding: 10px; box-sizing: border-box; font-size: 18px; border-radius: 8px; border: 1px solid #ccc; resize: none; }
    button { width: 100%; padding: 15px; font-size: 20px; font-weight: bold; background-color: #ff9800; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:active { background-color: #e68a00; transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="container">
    <textarea id="textInput" placeholder="伝えたいことを入力..."></textarea>
    <button onclick="speakText()">🗣️ 喋る</button>
  </div>
  <script>
    function speakText() {
      const text = document.getElementById('textInput').value;
      if (!text) return;
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'ja-JP';
      msg.rate = 1.1; // 少し早めのテンポ
      window.speechSynthesis.speak(msg);
    }
  </script>
</body>
</html>
